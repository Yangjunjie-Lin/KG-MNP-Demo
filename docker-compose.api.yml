services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      KG_MNP_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173"
      KG_MNP_API_HOST: "0.0.0.0"
      KG_MNP_API_PORT: "8000"
    volumes:
      - kg_mnp_runtime:/app/runtime_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional Neo4j (not required for health)
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/kgmnp-demo-pass

volumes:
  kg_mnp_runtime:
