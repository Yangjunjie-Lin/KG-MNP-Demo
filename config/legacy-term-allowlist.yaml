version: 1

# The current MNP compatibility gate scans Git-tracked files plus non-ignored files that are
# intended to be tracked. Domain Pack assets are scanned at their authoritative
# location; generated runtime output is forbidden from Git.
scan_roots:
  - src
  - schemas
  - examples
  - domain_packs
  - tests
  - scripts

legacy_terms:
  - 'http://example.org/kg-mnp#'
  - 'http://example.org/kg-mnp/'
  - 'https://example.org/kg-mnp/'
  - 'producesBlockingReason'
  - 'hasSubscription'
  - 'ownsPhoneNumber'
  - 'relatedAccount'
  - 'dependsOn'
  - 'AssessmentDependency'

# Every approval identifies one exact stripped line in one exact path.  Counts
# are checked and stale approvals fail, so this cannot exempt a whole file.
allowed_occurrences:

  - term: producesBlockingReason
    path: domain_packs/mnp/ontology/mnp-compliance.ttl
    line_text: 'mnp:producesBlockingReason a owl:ObjectProperty ;'
    count: 1
    category: deprecated_declaration
    reason: Deprecated declaration retained with owl:deprecated and replacementTerm metadata.

  - term: producesBlockingReason
    path: tests/ontology_release/test_stage03_core.py
    line_text: 'MNP.producesBlockingReason,'
    count: 1
    category: migration_test
    reason: Dedicated test verifies that the historical term is explicitly deprecated.

  - term: hasSubscription
    path: domain_packs/mnp/ontology/mnp-identity.ttl
    line_text: 'mnp:hasSubscription a owl:ObjectProperty ;'
    count: 1
    category: deprecated_declaration
    reason: Deprecated declaration retained with owl:deprecated and replacementTerm metadata.

  - term: hasSubscription
    path: tests/ontology_release/test_stage03_core.py
    line_text: 'MNP.hasSubscription,'
    count: 1
    category: migration_test
    reason: Dedicated test verifies that the historical term is explicitly deprecated.

  - term: ownsPhoneNumber
    path: domain_packs/mnp/ontology/mnp-identity.ttl
    line_text: 'mnp:ownsPhoneNumber a owl:ObjectProperty ;'
