version: 1

# The Stage 03 gate scans Git-tracked files plus non-ignored files that are
# intended to be tracked.  demo_outputs is included because it is a versioned
# release snapshot, not a disposable local runtime directory.
scan_roots:
  - src
  - ontology
  - shapes
  - schemas
  - examples
  - data
  - queries
  - competency_questions
  - mappings
  - rules
  - tests
  - scripts
  - demo_outputs

legacy_terms:
  - 'http://example.org/kg-mnp#'
  - 'http://example.org/kg-mnp/'
  - 'https://example.org/kg-mnp/'
  - 'producesBlockingReason'
  - 'hasSubscription'
  - 'ownsPhoneNumber'
  - 'relatedAccount'
  - 'dependsOn'
  - 'AssessmentDependency'

# Every approval identifies one exact stripped line in one exact path.  Counts
# are checked and stale approvals fail, so this cannot exempt a whole file.
allowed_occurrences:
  - term: 'http://example.org/kg-mnp#'
    path: scripts/stage03_constants.py
    line_text: 'OLD_TERM_NS = "http://example.org/kg-mnp#"'
    count: 1
    category: migration_source
    reason: Canonical old namespace input for the one-way Stage 03 IRI migration.
  - term: 'http://example.org/kg-mnp#'
    path: scripts/migrate_ontology_iris.py
    line_text: 'mapping["http://example.org/kg-mnp#"] = TERM_NS'
    count: 1
    category: migration_tool
    reason: Explicit source namespace handled by the one-way migration tool.

  - term: 'http://example.org/kg-mnp/'
    path: scripts/stage03_constants.py
    line_text: 'OLD_MODULE_BASE = "http://example.org/kg-mnp/"'
    count: 1
    category: migration_source
    reason: Canonical old ontology document base for deterministic one-way migration.
  - term: 'http://example.org/kg-mnp/'
    path: scripts/build_ontology_release.py
    line_text: '"old_iri": f"http://example.org/kg-mnp/{old}",'
    count: 1
    category: change_log_generator
    reason: Generates auditable old-to-new ontology document IRI migration rows.

  - term: producesBlockingReason
    path: ontology/mnp-compliance.ttl
    line_text: 'mnp:producesBlockingReason a owl:ObjectProperty ;'
    count: 1
    category: deprecated_declaration
    reason: Deprecated declaration retained with owl:deprecated and replacementTerm metadata.
  - term: producesBlockingReason
    path: scripts/build_ontology_release.py
    line_text: '("producesBlockingReason", "DEPRECATE", "hasBlockingReason", "ODR-002"),'
    count: 1
    category: change_log_generator
    reason: Generates the controlled term change log entry.
  - term: producesBlockingReason
    path: scripts/stage03_term_catalog_part3.py
    line_text: 'audit_notes="ODR-002 replacement for producesBlockingReason."),'
    count: 1
    category: deprecated_declaration_generator
    reason: Audit note attached to the accepted replacement declaration.
  - term: producesBlockingReason
    path: scripts/stage03_term_catalog_part3.py
    line_text: 'T(local="producesBlockingReason", term_type="ObjectProperty", module="COMPLIANCE",'
    count: 1
    category: deprecated_declaration_generator
    reason: Generates the deprecated ontology declaration.
  - term: producesBlockingReason
    path: tests/ontology_release/test_stage03_core.py
    line_text: 'MNP.producesBlockingReason,'
    count: 1
    category: migration_test
    reason: Dedicated test verifies that the historical term is explicitly deprecated.

