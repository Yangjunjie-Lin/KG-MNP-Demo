            while IFS= read -r id; do
              [[ -z "$id" ]] && continue
              if ! project="$(docker volume inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$id")"; then
                return 1
              fi
              printf '%s\n' "$project"
            done <<< "$ids"
          }
          discover_projects() {
            local containers networks volumes
            if ! containers="$(container_projects)"; then
              return 1
            fi
            if ! networks="$(network_projects)"; then
              return 1
            fi
            if ! volumes="$(volume_projects)"; then
              return 1
            fi
            printf '%s\n%s\n%s\n' "$containers" "$networks" "$volumes" |
              awk '/^kgmnp-app-[0-9a-f]{12}$/' | sort -u
