            if ! docker compose -p "$project" -f deploy/graphdb/docker-compose.integration.yml down -v --remove-orphans; then
              cleanup_status=1
            fi
          done
          if ! docker info >/dev/null; then
            echo 'Docker daemon unavailable while verifying Application cleanup' >&2
            cleanup_status=1
          elif ! remaining_output="$(discover_projects)"; then
            echo 'Could not verify Application Compose resource cleanup' >&2
            cleanup_status=1
          elif [[ -n "$remaining_output" ]]; then
            echo "Application Compose resources remain after cleanup: $remaining_output" >&2
            cleanup_status=1
