name: CI

on:
  push:
  pull_request:

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify Stage 03 core
        run: make verify-stage-03-core
      - name: Run OWL 2 DL reasoner
        run: make reasoner-check
      - name: Verify reasoner report
        run: make verify-reasoner-report
