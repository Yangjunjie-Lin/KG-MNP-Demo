name: CI

on:
  push:
  pull_request:

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify Stage 06
        run: make verify-stage-06
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi

  graphdb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pull pinned GraphDB image
        run: docker pull ontotext/graphdb:11.4.2@sha256:1593f8b5d42acb0f02f11b2a87b87ecbe76dbcec33cea56ca5bc32bebf6a7f12
      - name: Verify Stage 07
        env:
          GRAPHDB_LICENSE_CONTENT: ${{ secrets.GRAPHDB_LICENSE_CONTENT }}
        run: make verify-stage-07
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi
      - name: Always stop GraphDB integration resources
        if: always()
        run: |
          docker compose -f deploy/graphdb/docker-compose.integration.yml down -v --remove-orphans || true
