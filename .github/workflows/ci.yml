name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  governance-offline:
    if: github.event_name == 'pull_request'
    needs: [diagnostics-offline]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify Application Phase 04 offline
        run: make verify-application-phase-04-offline
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi

  governance-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [diagnostics-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Python and browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,webvowl]"
          python -m playwright install --with-deps chromium
      - name: Pull pinned GraphDB image
        run: docker pull ontotext/graphdb:11.4.2@sha256:1593f8b5d42acb0f02f11b2a87b87ecbe76dbcec33cea56ca5bc32bebf6a7f12
      - name: Reconstruct verified Phase 03 authority at exact SHA
        env:
          GRAPHDB_LICENSE_CONTENT: ${{ secrets.GRAPHDB_LICENSE_CONTENT }}
          GRAPHDB_LICENSE_B64: ${{ secrets.GRAPHDB_LICENSE_B64 }}
        run: make verify-application-phase-03
      - name: Verify Application Phase 04 offline gates
        run: make verify-application-phase-04-offline
      - name: Verify Application Phase 04 licensed governance closure
        id: phase04
        env:
          GRAPHDB_LICENSE_CONTENT: ${{ secrets.GRAPHDB_LICENSE_CONTENT }}
          GRAPHDB_LICENSE_B64: ${{ secrets.GRAPHDB_LICENSE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/governance_integration.py
          report="$(find runtime_reports/governance -name application-phase04-attestation.json -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$report"
          workspace_hash="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["production_workspace_hash"])' "$report")"
          test "${#workspace_hash}" -eq 64
          echo "workspace_hash=$workspace_hash" >> "$GITHUB_OUTPUT"
      - name: Prepare and independently verify exact Phase 04 artifact
        if: success()
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/application-phase04-attestation
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          report="$(find runtime_reports/governance -name application-phase04-attestation.json -printf '%T@ %h\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$report"
          for name in application-phase04-attestation.json governance-summary.json state-machine-summary.json authority-binding.json security-summary.json; do
            cp "$report/$name" "$ARTIFACT_DIR/$name"
          done
          publication_manifest="runtime_outputs/publication/full-confirmation/publication-manifest.json"
          publication_hash="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["publication_semantic_hash"])' "$publication_manifest")"
          python scripts/verify_application_phase04_artifact.py "$ARTIFACT_DIR" \
            --publication-package runtime_outputs/publication/full-confirmation \
            --publication-attestation "runtime_reports/publication/$publication_hash/publication-attestation.json" \
            --publication-scenario full-confirmation \
            --phase01-artifact-dir "runtime_reports/application/$publication_hash" \
            --phase02-artifact-dir "runtime_reports/workbench/$publication_hash" \
            --phase03-artifact-dir "runtime_reports/diagnostics/$publication_hash" \
            --expected-commit-sha "${GITHUB_SHA}" \
            --expected-workspace-hash "${{ steps.phase04.outputs.workspace_hash }}"
      - name: Upload Application Phase 04 attestation artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-phase04-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/application-phase04-attestation
          if-no-files-found: error
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi
      - name: Verify no Phase 04 integration resources remain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! docker info >/dev/null; then
            echo 'Docker daemon unavailable during Phase 04 cleanup verification' >&2
            exit 1
          fi
          set +e
          remaining="$(docker ps -aq --filter label=com.docker.compose.project | while read -r id; do
            docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$id"
          done | grep -E '^kgmnp-governance-[0-9a-f]{12}$')"
          discovery_status=$?
          set -e
          if (( discovery_status > 1 )); then
            echo 'Could not verify Phase 04 integration resource cleanup' >&2
            exit 1
          fi
          if [[ -n "$remaining" ]]; then
            echo "Phase 04 integration resources remain: $remaining" >&2
            exit 1
          fi

  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify Stage 06
        run: make verify-stage-06
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi

  graphdb-offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify GraphDB offline closure
        run: make verify-graphdb-offline
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi

  publication-offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify Stage 08 offline publication components
        run: make verify-stage-08-components
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi

  application-offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify Application Phase 01 offline
        run: make verify-application-phase-01-offline
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi

  graphdb-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pull pinned GraphDB image
        run: docker pull ontotext/graphdb:11.4.2@sha256:1593f8b5d42acb0f02f11b2a87b87ecbe76dbcec33cea56ca5bc32bebf6a7f12
      - name: Verify Stage 07 with licensed GraphDB
        env:
          GRAPHDB_LICENSE_CONTENT: ${{ secrets.GRAPHDB_LICENSE_CONTENT }}
          GRAPHDB_LICENSE_B64: ${{ secrets.GRAPHDB_LICENSE_B64 }}
        run: make verify-stage-07
      - name: Prepare non-sensitive Stage 07 attestation artifact
        if: success()
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/stage07-attestation
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/query-results"
          report="$(find runtime_reports/graphdb -name graphdb-import-attestation.json -print -quit)"
          test -n "$report"
          root="$(dirname "$report")"
          cp "$report" "$ARTIFACT_DIR/graphdb-import-attestation.json"
          cp "$root/verification/graph-counts.json" "$ARTIFACT_DIR/graph-counts.json"
          cp "$root/verification/invariant-results.json" "$ARTIFACT_DIR/invariant-results.json"
          cp "$root/verification/default-graph-check.json" "$ARTIFACT_DIR/default-graph-check.json"
          cp "$root/verification/default-dataset-semantics.json" "$ARTIFACT_DIR/default-dataset-semantics.json"
          cp "$root/runtime/graphdb-version.json" "$ARTIFACT_DIR/graphdb-version.json"
          cp "$root/runtime/inference-regression.json" "$ARTIFACT_DIR/inference-regression.json"
          cp "$root/verification/query-results/"*.json "$ARTIFACT_DIR/query-results/"
          python - "$ARTIFACT_DIR" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          errors = []
          forbidden_path_parts = {".docker", ".env", ".m2"}
          forbidden_path_markers = (
              "authorization",
              "cookie",
              "credential",
              "docker-auth",
              "docker-config",
              "env.json",
              "environment-dump",
              "environment.json",
              "license-content",
              "maven-cache",
              "raw-env",
              "settings.xml",
          )
          forbidden_key_markers = (
              "authorization",
              "cookie",
              "credential",
              "password",
              "rawenv",
              "secret",
              "token",
          )
          forbidden_keys = {
              "auths",
              "clientsecret",
              "credhelpers",
              "credsstore",
              "dockerconfig",
              "environment",
              "env",
              "graphdblicenseb64",
              "graphdblicensecontent",
              "identitytoken",
              "licensecontent",
              "licensepath",
              "mavencache",
              "mavensettings",
              "m2repository",
              "privatekey",
          }
          forbidden_value_patterns = (
              re.compile(r"(?i)\b(?:authorization|proxy-authorization|cookie|set-cookie)\s*[:=]"),
              re.compile(r"(?i)\bgraphdb_license_(?:content|b64)\s*="),
              re.compile(r"(?i)(?:^|[/\\])(?:\.docker|\.m2)(?:[/\\]|$)|settings\.xml|docker-credential-"),
              re.compile(r"(?im)(?:^|\n)\s*[A-Z_][A-Z0-9_]{1,63}=\S+"),
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(r"\b(?:AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,})\b"),
          )

          def reject_duplicate_keys(pairs):
              result = {}
              folded = set()
              for key, value in pairs:
                  marker = key.casefold()
                  if marker in folded:
                      raise ValueError(f"duplicate JSON key: {key}")
                  folded.add(marker)
                  result[key] = value
              return result

          def walk(value, location):
              if isinstance(value, dict):
                  for key, child in value.items():
                      normalized = re.sub(r"[^a-z0-9]", "", key.casefold())
                      if normalized in forbidden_keys or any(
                          marker in normalized for marker in forbidden_key_markers
                      ):
                          errors.append(f"{location}: sensitive JSON key {key!r}")
                      walk(child, f"{location}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{location}[{index}]")
              elif isinstance(value, str):
                  if any(pattern.search(value) for pattern in forbidden_value_patterns):
                      errors.append(f"{location}: sensitive string value")

          for path in sorted(root.rglob("*")):
              relative = path.relative_to(root)
              lowered = relative.as_posix().casefold()
              if path.is_symlink():
                  errors.append(f"{relative}: symlinks are forbidden")
                  continue
              if not path.is_file():
                  continue
              if (
                  any(part.casefold() in forbidden_path_parts for part in relative.parts)
                  or any(marker in lowered for marker in forbidden_path_markers)
              ):
                  errors.append(f"{relative}: sensitive filename")
              if path.suffix.casefold() != ".json":
                  errors.append(f"{relative}: non-JSON artifact file")
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
                  payload = json.loads(text, object_pairs_hook=reject_duplicate_keys)
              except (OSError, UnicodeError, json.JSONDecodeError, ValueError) as exc:
                  errors.append(f"{relative}: invalid JSON: {exc}")
                  continue
              walk(payload, relative.as_posix())

          if errors:
              print("attestation artifact sensitive-data scan failed:", file=sys.stderr)
              print("\n".join(f"- {item}" for item in errors), file=sys.stderr)
              raise SystemExit(1)
          print("attestation artifact sensitive-data scan: PASS")
          PY
      - name: Upload Stage 07 attestation artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage07-graphdb-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/stage07-attestation
          if-no-files-found: error
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi
      - name: Always stop GraphDB integration resources
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          discover_projects() {
            {
              docker ps -aq --filter label=com.docker.compose.project | while read -r id; do
                docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$id"
              done
              docker network ls -q --filter label=com.docker.compose.project | while read -r id; do
                docker network inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$id"
              done
              docker volume ls -q --filter label=com.docker.compose.project | while read -r id; do
                docker volume inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$id"
              done
            } | grep -E '^kgmnp-[0-9a-f]{12}$' | sort -u
          }
          cleanup_status=0
          if ! docker info >/dev/null; then
            echo 'Docker daemon unavailable during GraphDB cleanup' >&2
            exit 1
          fi
          mapfile -t projects < <(discover_projects)
          for project in "${projects[@]}"; do
            if ! docker compose -p "$project" -f deploy/graphdb/docker-compose.integration.yml down -v --remove-orphans; then
              cleanup_status=1
            fi
          done
          if ! docker info >/dev/null; then
            echo 'Docker daemon unavailable while verifying GraphDB cleanup' >&2
            cleanup_status=1
          else
            mapfile -t remaining < <(discover_projects)
            if (( ${#remaining[@]} != 0 )); then
              printf 'GraphDB Compose resources remain after cleanup: %s\n' "${remaining[*]}" >&2
              cleanup_status=1
            fi
          fi
          exit "$cleanup_status"

  amendment-offline:
    if: github.event_name == 'pull_request'
    needs: [governance-offline]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify Application Phase 05 offline
        run: make verify-application-phase-05-offline
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --short)"

  amendment-republication-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [governance-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,webvowl]"
          python -m playwright install --with-deps chromium
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pull pinned GraphDB image
        run: docker pull ontotext/graphdb:11.4.2@sha256:1593f8b5d42acb0f02f11b2a87b87ecbe76dbcec33cea56ca5bc32bebf6a7f12
      - name: Verify Phase 05 licensed upstream and controlled re-publication
        env:
          GRAPHDB_LICENSE_CONTENT: ${{ secrets.GRAPHDB_LICENSE_CONTENT }}
          GRAPHDB_LICENSE_B64: ${{ secrets.GRAPHDB_LICENSE_B64 }}
        run: make verify-application-phase-05
      - name: Independently verify Phase 05 exact artifact
        shell: bash
        run: |
          set -euo pipefail
          publication_hash="$(python -c 'import json; print(json.load(open("runtime_outputs/publication/full-confirmation/publication-manifest.json"))["publication_semantic_hash"])')"
          phase04_dir="$(find runtime_reports/governance -name application-phase04-attestation.json -printf '%T@ %h\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          python scripts/verify_application_phase05_artifact.py "runtime_reports/amendment/$GITHUB_SHA" \
            --stage08-artifact runtime_outputs/publication/full-confirmation \
            --publication-attestation "runtime_reports/publication/$publication_hash/publication-attestation.json" \
            --phase01-artifact "runtime_reports/application/$publication_hash" \
            --phase02-artifact "runtime_reports/workbench/$publication_hash" \
            --phase03-artifact "runtime_reports/diagnostics/$publication_hash" \
            --phase04-artifact "$phase04_dir" \
            --expected-commit-sha "$GITHUB_SHA"
      - name: Upload Application Phase 05 attestation artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-phase05-attestation-${{ github.sha }}
          path: runtime_reports/amendment/${{ github.sha }}
          if-no-files-found: error
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --short)"

  activation-offline:
    if: github.event_name == 'pull_request'
    needs: [amendment-offline]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify Application Phase 06 offline
        run: make verify-application-phase-06-offline
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --short)"

  activation-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [amendment-republication-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Python and browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,webvowl]"
          python -m playwright install --with-deps chromium
      - name: Pull pinned GraphDB image
        run: docker pull ontotext/graphdb:11.4.2@sha256:1593f8b5d42acb0f02f11b2a87b87ecbe76dbcec33cea56ca5bc32bebf6a7f12
      - name: Verify Phase 06 licensed activation and rollback closure
        id: phase06
        env:
          GRAPHDB_LICENSE_CONTENT: ${{ secrets.GRAPHDB_LICENSE_CONTENT }}
          GRAPHDB_LICENSE_B64: ${{ secrets.GRAPHDB_LICENSE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          make verify-application-phase-06
          report="runtime_reports/activation/$GITHUB_SHA"
          summary="$report/activation-summary.json"
          registry_state="runtime_outputs/activation/controlled/$GITHUB_SHA/main-state/activation-registry.json"
          test -f "$summary"
          test -f "$registry_state"
          registry_hash="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["registry_hash"])' "$registry_state")"
          head_event_hash="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["head_event_hash"])' "$registry_state")"
          [[ "$registry_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$head_event_hash" =~ ^[0-9a-f]{64}$ ]]
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["controlled_registry_hash"])' "$summary")" = "$registry_hash"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["controlled_head_event_hash"])' "$summary")" = "$head_event_hash"
          echo "registry_hash=$registry_hash" >> "$GITHUB_OUTPUT"
          echo "head_event_hash=$head_event_hash" >> "$GITHUB_OUTPUT"
      - name: Stage and independently verify exact Phase 06 artifact
        if: success()
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/application-phase06-attestation
        run: |
          set -euo pipefail
          test ! -e "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          report="runtime_reports/activation/$GITHUB_SHA"
          test -d "$report"
          for name in application-phase06-attestation.json activation-summary.json rollback-summary.json authority-binding.json security-summary.json; do
            test -f "$report/$name"
            cp "$report/$name" "$ARTIFACT_DIR/$name"
          done
          publication_manifest="runtime_outputs/publication/full-confirmation/publication-manifest.json"
          publication_hash="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["publication_semantic_hash"])' "$publication_manifest")"
          phase04_dir="$(find runtime_reports/governance -name application-phase04-attestation.json -printf '%T@ %h\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$phase04_dir"
          python scripts/verify_application_phase06_artifact.py "$ARTIFACT_DIR" \
            --publication-package runtime_outputs/publication/full-confirmation \
            --publication-attestation "runtime_reports/publication/$publication_hash/publication-attestation.json" \
            --publication-scenario full-confirmation \
            --phase01-artifact-dir "runtime_reports/application/$publication_hash" \
            --phase02-artifact-dir "runtime_reports/workbench/$publication_hash" \
            --phase03-artifact-dir "runtime_reports/diagnostics/$publication_hash" \
            --phase04-artifact-dir "$phase04_dir" \
            --phase05-artifact-dir "runtime_reports/amendment/$GITHUB_SHA" \
            --expected-commit-sha "$GITHUB_SHA" \
            --expected-registry-hash "${{ steps.phase06.outputs.registry_hash }}" \
            --expected-head-event-hash "${{ steps.phase06.outputs.head_event_hash }}"
      - name: Upload Application Phase 06 attestation artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-phase06-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/application-phase06-attestation
          if-no-files-found: error
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --short)"
      - name: Always remove and verify Phase 06 controlled resources
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          discover_projects() {
            {
              docker ps -aq --filter label=com.docker.compose.project | while read -r id; do
                docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$id"
              done
              docker network ls -q --filter label=com.docker.compose.project | while read -r id; do
                docker network inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$id"
              done
              docker volume ls -q --filter label=com.docker.compose.project | while read -r id; do
                docker volume inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$id"
              done
            } | awk '/^kgmnp-activation-[0-9a-f]{12}$/' | sort -u
          }
          cleanup_status=0
          if ! docker info >/dev/null; then
            echo 'Docker daemon unavailable during Phase 06 cleanup' >&2
            exit 1
          fi
          if ! projects_output="$(discover_projects)"; then
            echo 'Could not discover Phase 06 controlled resources' >&2
            exit 1
          fi
          projects=()
          if [[ -n "$projects_output" ]]; then
            mapfile -t projects <<< "$projects_output"
          fi
          for project in "${projects[@]}"; do
            if ! docker compose -p "$project" -f deploy/graphdb/docker-compose.integration.yml down -v --remove-orphans; then
              cleanup_status=1
            fi
          done
          if ! docker info >/dev/null; then
            echo 'Docker daemon unavailable while verifying Phase 06 cleanup' >&2
            cleanup_status=1
          elif ! remaining_output="$(discover_projects)"; then
            echo 'Could not verify Phase 06 controlled resource cleanup' >&2
            cleanup_status=1
          elif [[ -n "$remaining_output" ]]; then
            echo "Phase 06 controlled resources remain: $remaining_output" >&2
            cleanup_status=1
          fi
          if (( cleanup_status != 0 )); then
            echo 'INTEGRATION_CLEANUP_FAILED' >&2
          fi
          exit "$cleanup_status"

