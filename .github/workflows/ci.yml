name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"
      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py
      - name: Pytest
        run: |
          mkdir -p runtime_reports
          pytest -q \
            --durations=20 \
            --junitxml=runtime_reports/pytest-${{ matrix.python-version }}.xml
      - name: 上传 Python 测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: runtime_reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Reference checks
        run: python scripts/check_references.py
      - name: Rule version checks
        run: python scripts/check_rule_versions.py
      - name: OpenAPI drift
        run: python scripts/check_openapi_drift.py
      - name: Seed demo data
        run: |
          rm -rf runtime_data
          python scripts/seed_demo_data.py
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          db = Path("runtime_data/kg_mnp.sqlite3")
          assert db.exists()
          conn = sqlite3.connect(db)
          conn.row_factory = sqlite3.Row
          rows = conn.execute(
              "SELECT assessment_time, decision, result_json FROM executions WHERE case_id='CASE-06'"
          ).fetchall()
          assert len(rows) == 2
          hist = cur = None
          for row in rows:
              result = json.loads(row["result_json"])
              if str(row["assessment_time"]).startswith("2026-05-15"):
                  hist = result
              if str(row["assessment_time"]).startswith("2026-07-01"):
                  cur = result
          assert hist and cur
          assert hist["decision"] == "ELIGIBLE"
          assert cur["decision"] == "BLOCKED"
          hr = next(r for r in hist["rule_results"] if r["rule_id"] == "MNP-ELIG-005")
          cr = next(r for r in cur["rule_results"] if r["rule_id"] == "MNP-ELIG-005")
          assert hr["version"] == "1.0" and hr["status"] == "PASS"
          assert cr["version"] == "1.1" and cr["status"] == "FAIL"
          print("CASE-06 seed checks OK")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: OpenAPI 类型漂移检查
        working-directory: frontend
        run: |
          npm run api:check
          git ls-files --error-unmatch src/api/generated/schema.ts

      - name: TypeScript 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 前端测试
        working-directory: frontend
        run: npm run test

      - name: 前端构建
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 校验全栈 Compose
        run: docker compose -f docker-compose.fullstack.yml config
      - name: 构建全栈镜像
        run: docker compose -f docker-compose.fullstack.yml build
      - name: 启动全栈容器
        run: docker compose -f docker-compose.fullstack.yml up -d --build --wait
      - name: 运行 Docker 全栈冒烟
        run: python scripts/docker_fullstack_smoke.py 2>&1 | tee docker-fullstack-smoke.log
      - name: 写入 Docker 验收摘要
        if: always()
        run: |
          echo "## Docker Compose 运行态验收" >> "$GITHUB_STEP_SUMMARY"
          echo "状态：${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docker-fullstack-smoke.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat docker-fullstack-smoke.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 输出容器日志
        if: failure()
        run: docker compose -f docker-compose.fullstack.yml logs --no-color
      - name: 停止并清理容器
        if: always()
        run: docker compose -f docker-compose.fullstack.yml down -v --remove-orphans

  fullstack-e2e:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: /api/v1
      VITE_DATA_SOURCE: api
      VITE_ENABLE_TECHNICAL_VIEW: "false"
      PLAYWRIGHT_EXTERNAL_SERVERS: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 清理并初始化演示数据
        run: |
          rm -rf runtime_data
          python scripts/seed_demo_data.py

      - name: 启动真实全栈并等待就绪
        run: |
          python scripts/run_fullstack.py > /tmp/kg-mnp-fullstack.log 2>&1 &
          echo $! > /tmp/kg-mnp-fullstack.pid
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          def wait(url, *, ready=False):
              deadline = time.monotonic() + 60
              error = None
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          payload = json.load(response) if ready else None
                          if not ready or (payload.get("status") == "ready" and payload.get("sqlite") is True):
                              return
                  except (OSError, TimeoutError, urllib.error.URLError, json.JSONDecodeError) as exc:
                      error = exc
                  time.sleep(1)
              raise SystemExit(f"Timed out waiting for {url}: {error}")

          wait("http://127.0.0.1:8000/api/v1/ready", ready=True)
          wait("http://127.0.0.1:5173/")
          PY

      - name: 运行真实全栈 E2E
        working-directory: frontend
        run: npx playwright test

      - name: 输出服务日志
        if: failure()
        run: cat /tmp/kg-mnp-fullstack.log || true

      - name: 上传 Playwright 失败产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 停止全栈服务
        if: always()
        run: |
          if [ -f /tmp/kg-mnp-fullstack.pid ]; then
            kill -TERM "$(cat /tmp/kg-mnp-fullstack.pid)" 2>/dev/null || true
            wait "$(cat /tmp/kg-mnp-fullstack.pid)" 2>/dev/null || true
          fi
