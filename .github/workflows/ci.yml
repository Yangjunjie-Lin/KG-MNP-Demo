  webvowl-publication-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [graphdb-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java (ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Python and browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,webvowl]"
          python -m playwright install --with-deps chromium
      - name: Pull pinned GraphDB image
        run: docker pull ontotext/graphdb:11.4.2@sha256:1593f8b5d42acb0f02f11b2a87b87ecbe76dbcec33cea56ca5bc32bebf6a7f12
      - name: Verify Stage 08 with licensed GraphDB and live WebVOWL
        env:
          GRAPHDB_LICENSE_CONTENT: ${{ secrets.GRAPHDB_LICENSE_CONTENT }}
          GRAPHDB_LICENSE_B64: ${{ secrets.GRAPHDB_LICENSE_B64 }}
        run: make verify-stage-08
      - name: Prepare non-sensitive Stage 08 attestation artifact
        if: success()
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/stage08-attestation
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          report="$(find runtime_reports/publication -name publication-attestation.json -printf '%T@ %h\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$report"
          for name in publication-attestation.json publication-manifest.json visualization-manifest.json ontology-visualization-coverage.json representation-loss.json tbox-equivalence.json webvowl-runtime.json browser-smoke.json upstream-lock.json hash-summary.json; do
            cp "$report/$name" "$ARTIFACT_DIR/$name"
          done
          python - "$ARTIFACT_DIR" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          errors = []
          forbidden_path_parts = {".docker", ".env", ".m2"}
          forbidden_path_markers = (
              "authorization",
              "cookie",
              "credential",
              "docker-auth",
              "docker-config",
              "env.json",
              "environment-dump",
              "environment.json",
              "license-content",
              "maven-cache",
              "node_modules",
              "raw-env",
              "settings.xml",
          )
          expected_files = {
              "browser-smoke.json",
              "hash-summary.json",
              "ontology-visualization-coverage.json",
              "publication-attestation.json",
              "publication-manifest.json",
              "representation-loss.json",
              "tbox-equivalence.json",
              "upstream-lock.json",
              "visualization-manifest.json",
              "webvowl-runtime.json",
          }
          documents = {}
          actual_files = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() or path.is_symlink()
          }
          if actual_files != expected_files:
              missing = sorted(expected_files - actual_files)
              unexpected = sorted(actual_files - expected_files)
              if missing:
                  errors.append("missing required artifact files: " + ", ".join(missing))
              if unexpected:
                  errors.append("unexpected artifact files: " + ", ".join(unexpected))
          forbidden_key_markers = (
              "authorization",
              "cookie",
              "credential",
              "password",
              "rawenv",
              "secret",
              "token",
          )
          forbidden_keys = {
              "auths",
              "clientsecret",
              "credhelpers",
              "credsstore",
              "dockerconfig",
              "environment",
              "env",
              "graphdblicenseb64",
              "graphdblicensecontent",
              "identitytoken",
              "licensecontent",
              "licensepath",
              "mavencache",
              "mavensettings",
              "m2repository",
              "privatekey",
          }
          forbidden_value_patterns = (
              re.compile(r"(?i)\b(?:authorization|proxy-authorization|cookie|set-cookie)\s*[:=]"),
              re.compile(r"(?i)\bgraphdb_license_(?:content|b64)\s*="),
              re.compile(r"(?i)(?:^|[/\\])(?:\.docker|\.m2)(?:[/\\]|$)|settings\.xml|docker-credential-"),
              re.compile(r"(?im)(?:^|\n)\s*[A-Z_][A-Z0-9_]{1,63}=\S+"),
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(r"\b(?:AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,})\b"),
          )

          def reject_duplicate_keys(pairs):
              result = {}
              folded = set()
              for key, value in pairs:
                  marker = key.casefold()
                  if marker in folded:
                      raise ValueError(f"duplicate JSON key: {key}")
                  folded.add(marker)
                  result[key] = value
              return result

          def walk(value, location):
              if isinstance(value, dict):
                  for key, child in value.items():
                      normalized = re.sub(r"[^a-z0-9]", "", key.casefold())
                      if normalized in forbidden_keys or any(
                          marker in normalized for marker in forbidden_key_markers
                      ):
                          errors.append(f"{location}: sensitive JSON key {key!r}")
                      walk(child, f"{location}.{key}")
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{location}[{index}]")
              elif isinstance(value, str):
                  if any(pattern.search(value) for pattern in forbidden_value_patterns):
                      errors.append(f"{location}: sensitive string value")

          for path in sorted(root.rglob("*")):
              relative = path.relative_to(root)
              lowered = relative.as_posix().casefold()
              if path.is_symlink():
                  errors.append(f"{relative}: symlinks are forbidden")
                  continue
              if not path.is_file():
                  continue
              if (
                  any(part.casefold() in forbidden_path_parts for part in relative.parts)
                  or any(marker in lowered for marker in forbidden_path_markers)
              ):
                  errors.append(f"{relative}: sensitive filename")
              if path.suffix.casefold() != ".json":
                  errors.append(f"{relative}: non-JSON artifact file")
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
                  payload = json.loads(text, object_pairs_hook=reject_duplicate_keys)
              except (OSError, UnicodeError, json.JSONDecodeError, ValueError) as exc:
                  errors.append(f"{relative}: invalid JSON: {exc}")
                  continue
              documents[relative.as_posix()] = payload
              walk(payload, relative.as_posix())

          if not errors:
              try:
                  from kg_mnp_demo.publication.contracts import (
                      validate_publication_attestation_evidence,
                      validate_publication_contract,
                  )
                  from kg_mnp_demo.webvowl.contracts import validate_webvowl_contract

                  validate_publication_contract(
                      "end-to-end-publication-manifest",
                      documents["publication-manifest.json"],
                  )
                  validate_webvowl_contract(
                      "visualization-manifest",
                      documents["visualization-manifest.json"],
                  )
                  validate_webvowl_contract(
                      "coverage-report",
                      documents["ontology-visualization-coverage.json"],
                  )
                  validate_webvowl_contract(
                      "representation-loss",
                      documents["representation-loss.json"],
                  )
                  validate_publication_attestation_evidence(
                      documents["publication-attestation.json"],
                      publication_manifest=documents["publication-manifest.json"],
                      visualization_manifest=documents["visualization-manifest.json"],
                      coverage=documents["ontology-visualization-coverage.json"],
                      representation_loss=documents["representation-loss.json"],
                      tbox_equivalence=documents["tbox-equivalence.json"],
                      upstream_lock=documents["upstream-lock.json"],
                      browser_smoke=documents["browser-smoke.json"],
                      webvowl_runtime=documents["webvowl-runtime.json"],
                  )
                  summary = documents["hash-summary.json"]
                  expected_summary_files = expected_files - {"hash-summary.json"}
                  if (
                      summary.get("contract_version") != "1.0"
                      or set(summary.get("sha256", {})) != expected_summary_files
                  ):
                      raise ValueError("hash summary artifact set mismatch")
                  for name in sorted(expected_summary_files):
                      actual_hash = hashlib.sha256((root / name).read_bytes()).hexdigest()
                      if summary["sha256"][name] != actual_hash:
                          raise ValueError(f"hash summary mismatch: {name}")
              except Exception as exc:
                  errors.append(f"semantic attestation validation failed: {exc}")

          if errors:
              print("attestation artifact sensitive-data scan failed:", file=sys.stderr)
              print("\n".join(f"- {item}" for item in errors), file=sys.stderr)
              raise SystemExit(1)
          print("attestation artifact sensitive-data scan: PASS")
          PY
      - name: Upload Stage 08 publication attestation artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage08-publication-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/stage08-attestation
          if-no-files-found: error
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi
      - name: Always stop Stage 08 integration resources
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          discover_projects() {
            {
              docker ps -aq --filter label=com.docker.compose.project | while read -r id; do
                docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' "$id"
              done
              docker network ls -q --filter label=com.docker.compose.project | while read -r id; do
                docker network inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$id"
              done
              docker volume ls -q --filter label=com.docker.compose.project | while read -r id; do
                docker volume inspect --format '{{ index .Labels "com.docker.compose.project" }}' "$id"
              done
            } | grep -E '^kgmnp-(webvowl-)?[0-9a-f]{12}$' | sort -u
          }
          cleanup_status=0
          if ! docker info >/dev/null; then
            echo 'Docker daemon unavailable during Stage 08 cleanup' >&2
            exit 1
          fi
          mapfile -t projects < <(discover_projects)
          for project in "${projects[@]}"; do
            if [[ "$project" == kgmnp-webvowl-* ]]; then
              compose_file=deploy/webvowl/docker-compose.integration.yml
            else
              compose_file=deploy/graphdb/docker-compose.integration.yml
            fi
            if ! docker compose -p "$project" -f "$compose_file" down -v --remove-orphans; then
              cleanup_status=1
            fi
          done
          if ! docker info >/dev/null; then
            echo 'Docker daemon unavailable while verifying Stage 08 cleanup' >&2
            cleanup_status=1
          else
            mapfile -t remaining < <(discover_projects)
            if (( ${#remaining[@]} != 0 )); then
              printf 'Stage 08 Compose resources remain after cleanup: %s\n' "${remaining[*]}" >&2
              cleanup_status=1
            fi
          fi
          exit "$cleanup_status"
