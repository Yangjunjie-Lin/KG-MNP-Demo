name: Real workbench workflows
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - run: npm --prefix workbench test
      - run: npm --prefix workbench run build
      - working-directory: workbench
        run: npx playwright install --with-deps chromium
      - run: python tools/run_browser_verification.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: runtime_logs/p09/browser-runs
  rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - working-directory: workbench
        run: npx playwright install --with-deps chromium
      - run: npm --prefix workbench run test:rendering
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-evidence
          path: runtime_logs/p09/rendering
