name: Real workbench workflows
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - run: npm --prefix workbench test
      - run: npm --prefix workbench run build
      - working-directory: workbench
        run: npx playwright install --with-deps chromium
      - run: python tools/run_browser_verification.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: runtime_logs/p09/browser-runs
