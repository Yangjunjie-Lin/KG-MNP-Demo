name: Dependency advisory evidence
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: python tools/audit_python_lock.py requirements-dev.lock --output runtime_logs/python-advisories.json
      - run: npm --prefix workbench audit --audit-level=low
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisories
          path: runtime_logs/python-advisories.json
