name: Isolated distribution verification
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  distributions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - run: python tools/verify_distribution.py --output runtime_logs/distributions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-evidence-${{ matrix.os }}
          path: |
            runtime_logs/distributions/artifacts/*
            runtime_logs/distributions/rebuilt/*
            runtime_logs/distributions/distribution-verification.json
            runtime_logs/distributions/*/receipt.json
            runtime_logs/distributions/*/command.log
            runtime_logs/distributions/*-runtime/probe.json
