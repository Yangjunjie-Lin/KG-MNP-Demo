name: Prepare locked toolchain
description: Shared explicit preparation; no runtime dependency downloads
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '24.15.0'
        cache: npm
        cache-dependency-path: workbench/package-lock.json
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - shell: bash
      run: python -m pip install -c requirements-dev.lock -e '.[dev,webvowl]'
    - shell: bash
      run: npm ci --prefix workbench
    - shell: bash
      run: python tools/prepare_reasoner.py
