[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-mnp-demo"
version = "0.1.0"
description = "KG-MNP Mobile Number Portability eligibility ontology demo with evidence-rule-clause-action traceability"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "KG-MNP Demo Contributors" }]
dependencies = [
  "rdflib>=7.0.0,<8.0.0",
  "pyshacl>=0.26.0,<1.0.0",
  "owlrl>=6.0.2,<7.0.0",
  "PyYAML>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0"]
neo4j = ["neo4j>=5.14.0,<6.0.0"]

[project.scripts]
kg-mnp = "kg_mnp_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:deepeval"
markers = [
  "neo4j: integration tests requiring a running Neo4j instance",
]
