[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "zhigou-toolchain"
dynamic = ["version"]
description = "Evidence-bound, review-governed ontology engineering toolchain"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "ZhiGou Toolchain Contributors" }]
dependencies = [
  "packaging==26.3",
  "rdflib==7.6.0",
  "pyshacl>=0.26.0,<1.0.0",
  "owlrl>=6.0.2,<7.0.0",
  "PyYAML>=6.0.1,<7.0.0",
  "jsonschema>=4.22.0,<5.0.0",
  "fastapi==0.141.1",
  "starlette==1.3.1",
  "uvicorn==0.30.6",
  "httpx==0.27.2",
]

[project.optional-dependencies]
modeling-analysis = ["pandas==2.2.3", "networkx==3.6.1"]
modeling-models = ["FlagEmbedding==1.3.5", "faiss-cpu==1.10.0", "transformers==4.51.3"]
ingestion-multimodal = [
  "transformers==4.51.3", "torch>=2.6.0,<3.0.0", "Pillow>=10.0.0,<13.0.0",
  "pypdf>=5.0.0,<7.0.0", "pypdfium2==4.30.0", "imageio-ffmpeg==0.6.0",
  "opencv-python-headless==4.11.0.86",
]
dev = [
  "pandas==2.2.3",
  "networkx==3.6.1",
  "setuptools==83.0.0",
  "wheel==0.46.2",
  "build==1.3.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-xdist>=3.6.0,<4.0.0",
  "ruff==0.16.2",
  "httpx==0.27.2",
  "pypdf>=5.0.0,<7.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "python-docx>=1.1.0,<2.0.0",
  "Pillow>=10.0.0,<13.0.0",
  "defusedxml>=0.7.1,<1.0.0",
]
ingestion-documents = [
  "pypdf>=5.0.0,<7.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "python-docx>=1.1.0,<2.0.0",
  "Pillow>=10.0.0,<13.0.0",
  "defusedxml>=0.7.1,<1.0.0",
]

[project.scripts]
zhigou-toolchain = "zhigou_toolchain.root_cli:main"
kg-mnp = "kg_mnp:legacy_main"

[project.entry-points."kg_mnp.plugins"]
local-file-source = "kg_mnp.plugins.builtin.source_file:LocalFileSource"
signature-media-detector = "kg_mnp.plugins.builtin.media_detector:SignatureMediaDetector"
plain-text-parser = "kg_mnp.plugins.builtin.text_parser:PlainTextParser"
markdown-parser = "kg_mnp.plugins.builtin.markdown_parser:MarkdownParser"
json-parser = "kg_mnp.plugins.builtin.json_parser:JSONParser"
delimited-text-parser = "kg_mnp.plugins.builtin.delimited_parser:DelimitedTextParser"
generic-normalizer = "kg_mnp.plugins.builtin.normalizer:GenericNormalizer"
structural-quality-evaluator = "kg_mnp.plugins.builtin.quality:StructuralQualityEvaluator"
wav-metadata-parser = "kg_mnp.plugins.builtin.wav_metadata_parser:WavMetadataParser"
xlsx-parser = "kg_mnp.plugins.builtin.xlsx_parser:XlsxParser"
docx-parser = "kg_mnp.plugins.builtin.docx_parser:DocxParser"
pdf-parser = "kg_mnp.plugins.builtin.pdf_parser:PdfParser"
image-metadata-parser = "kg_mnp.plugins.builtin.image_metadata_parser:ImageMetadataParser"
manual-candidate-provider = "kg_mnp.plugins.builtin.modeling_providers:ManualCandidateProvider"
baseline-reuse-provider = "kg_mnp.plugins.builtin.modeling_providers:BaselineReuseProvider"
rule-mapping-provider = "kg_mnp.plugins.builtin.modeling_providers:RuleMappingProvider"
recorded-model-output-provider = "kg_mnp.plugins.builtin.modeling_providers:RecordedModelOutputProvider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "zhigou_toolchain.__version__"}

[tool.setuptools.package-data]
"zhigou_toolchain.modeling.five_stage" = ["resources/*.json", "resources/reference/*.json", "resources/tutorial/input/*", "resources/tutorial/stages/*", "resources/tutorial/output/*", "resources/tutorial/output/queries/*", "resources/tutorial/output/tests/*", "resources/tutorial/anomaly/*"]
"zhigou_toolchain.contracts" = [
  "catalog.json",
  "catalog.lock.json",
  "schemas/toolchain/*.schema.json",
  "schemas/modeling/*.schema.json",
  "schemas/compilation/*.schema.json",
  "schemas/lifecycle/*.schema.json",
]
"zhigou_toolchain.plugins.builtin" = ["manifests/*.json"]
"zhigou_toolchain.semantic_kernel" = ["resources/*.ttl", "resources/*.yaml"]
"zhigou_toolchain.lifecycle" = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:deepeval -p no:asyncio"

[tool.ruff.lint.isort]
# Legacy deep imports resolve through the alias shim, not physical subpackages.
# Explicit classification also avoids stale auto-discovery cache after migration.
known-first-party = ["kg_mnp", "zhigou_toolchain"]
