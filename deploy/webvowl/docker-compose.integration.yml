services:
  webvowl:
    build:
      context: ../..
      dockerfile: deploy/webvowl/Dockerfile.integration
      target: webvowl-runtime
      args:
        MAVEN_DIGEST: sha256:0537e78bbba084ec350fcaa0dedef6efa34440e4e464bbb284f0f1e47043f629
        NODE_DIGEST: sha256:4517380049fc3c9aacceae7764fcf3500354b0ac8a47e4afb35b5bbeb75b9498
        WEBVOWL_NPM_SHRINKWRAP_SHA256: 74c5094525121337d6b71d0862ec9543a0356e536b00fe67b45f03d031f0fdda
        TOMCAT_JDK_DIGEST: sha256:41836df54c3781e0e835e61a4761b566d0de9187eb6c56340191b343e1fe3101
        TOMCAT_JRE_DIGEST: sha256:6ac38ff9831b03e18e83174eca45d746f2accde3a5c8f8bc48ba2c9fd63b8b17
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /usr/local/tomcat/temp:rw,noexec,nosuid,size=64m
      - /usr/local/tomcat/work:rw,noexec,nosuid,size=128m
      - /usr/local/tomcat/logs:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: ../../ontology
        target: /opt/ontology-input
        read_only: true
    networks:
      - webvowl-internal

  loopback-proxy:
    build:
      context: ../..
      dockerfile: deploy/webvowl/Dockerfile.integration
      target: loopback-proxy
      args:
        NODE_DIGEST: sha256:4517380049fc3c9aacceae7764fcf3500354b0ac8a47e4afb35b5bbeb75b9498
    depends_on:
      webvowl:
        condition: service_healthy
    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - webvowl-internal
      - loopback-publish

networks:
  webvowl-internal:
    internal: true
  loopback-publish:
    driver: bridge
