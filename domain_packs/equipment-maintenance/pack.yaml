{
  "manifest_kind": "KG_MNP_DOMAIN_PACK",
  "schema_version": "1.0.0",
  "pack_id": "equipment-maintenance",
  "pack_version": "0.1.0",
  "display_name": "设备资产与维护（合成工程模板）",
  "description": "Source-bound assets and locations; actions never authorized by a template.",
  "lifecycle": "EXPERIMENTAL",
  "compatibility": {
    "contract_major": 1,
    "minimum_toolchain_version": "0.2.0"
  },
  "license": {
    "expression": "Apache-2.0",
    "notice_files": []
  },
  "capabilities": [
    "ontology",
    "queries",
    "shacl"
  ],
  "namespaces": {
    "ontology": "urn:scenario:equipment_maintenance:ontology",
    "terms": "urn:scenario:equipment_maintenance:"
  },
  "assets": [
    {
      "asset_id": "equipment-ontology",
      "kind": "ontology-root",
      "path": "ontology/equipment.ttl",
      "media_type": "text/turtle",
      "required": true,
      "description": "Explicit synthetic equipment policy; not deployment authority",
      "ontology_iri": "urn:scenario:equipment_maintenance:ontology",
      "version_iri": "urn:scenario:equipment_maintenance:ontology:0.1.0"
    },
    {
      "asset_id": "equipment-query-devices",
      "kind": "query",
      "path": "queries/devices.rq",
      "media_type": "application/sparql-query",
      "required": true,
      "description": "Explicit synthetic equipment policy; not deployment authority"
    },
    {
      "asset_id": "equipment-shapes",
      "kind": "shacl-shapes",
      "path": "shapes/equipment.ttl",
      "media_type": "text/turtle",
      "required": true,
      "description": "Explicit synthetic equipment policy; not deployment authority",
      "profile": "default"
    }
  ],
  "entrypoints": {
    "ontology": "equipment-ontology",
    "shacl": "equipment-shapes",
    "queries": "equipment-query-devices"
  },
  "dependencies": [],
  "extensions": {}
}
