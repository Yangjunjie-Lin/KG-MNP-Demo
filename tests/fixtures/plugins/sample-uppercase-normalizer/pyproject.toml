[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-uppercase-normalizer"
version = "1.0.0"
requires-python = ">=3.11"

[project.entry-points."kg_mnp.plugins"]
sample-uppercase-normalizer = "sample_uppercase_normalizer.plugin:UppercaseNormalizer"

[tool.setuptools.package-data]
sample_uppercase_normalizer = ["kg_mnp_plugin_manifest.json"]
