services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -c
      - >-
        set -eu;
        seed_complete() { python -c 'import sqlite3, sys; expected = {"CASE-%02d" % index for index in range(1, 10)}; connection = sqlite3.connect("/app/runtime_data/kg_mnp.sqlite3"); table = connection.execute("SELECT 1 FROM sqlite_master WHERE type = ? AND name = ?", ("table", "executions")).fetchone(); counts = dict(connection.execute("SELECT case_id, COUNT(*) FROM executions GROUP BY case_id").fetchall()) if table else {}; sys.exit(0 if expected.issubset(counts) and counts.get("CASE-06", 0) >= 2 else 1)'; };
        if ! seed_complete; then
          python scripts/seed_demo_data.py;
        fi;
        seed_complete;
        exec uvicorn kg_mnp_demo.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      KG_MNP_API_HOST: "0.0.0.0"
      KG_MNP_API_PORT: "8000"
      KG_MNP_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    volumes:
      - kg_mnp_fullstack_runtime:/app/runtime_data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)); assert data.get('status') == 'ready' and data.get('sqlite') is True
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_DATA_SOURCE: api
        VITE_ENABLE_TECHNICAL_VIEW: "false"
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  kg_mnp_fullstack_runtime:
