    const p=pending.data,one=n===1;
    const body=(one?`<p>核对本轮范围后，才将结果交给结构设计。原始数据不会被改写。</p>${table(['确认事项','本轮内容'],[['对象与关系','员工、部门；员工的当前所属部门'],['身份与规则','编号作为字符串；每位员工对应一个已登记部门'],['独立查询预期',`${p.expected.length} 条答案，已在构建前给定`]])}`:`<p>请核对本轮候选的关系方向与原文依据。这里的确认只属于当前浏览器模拟，不生成真实审批。</p>${relationTable(b(3).relations,'after')}<p class="comparison-note">已完成 ${p.checks.checks.length} 类本地规则检查；完整 SHACL / OWL 逻辑验证未运行。</p>`)+`<div class="dialog-section"><h3>本轮确认</h3>${tag('仅本地模拟','amber')}</div><label class="check-label"><input type="checkbox" id="review-ack"><span>我已核对${one?'建模范围、业务规则与独立验收预期':'关系方向、当前范围和来源依据'}，并理解此次确认仅用于模拟。</span></label>`;
    openDialog(one?'确认本轮建模范围':'确认本轮审核结果',body,`<button class="btn" data-action="close">稍后确认</button><button class="btn primary" data-action="confirm">${ico('check')}${one?'确认范围并保留结果':'确认审核并冻结结果'}</button>`,false,'review');
  }
  function confirmReview(){if(!pending)return;if(!document.getElementById('review-ack')?.checked){document.getElementById('review-ack')?.focus();return toast('请先勾选本轮确认。');}const {phase,data}=pending;data.simulated_confirmation={status:'CONFIRMED_IN_LOCAL_SIMULATION',actor:'LOCAL_OPERATOR',time:new Date().toISOString(),formal_approval:'NOT_REVIEWED'};dialogKind='';dlg.close();commit(phase,data);render();scheduleNext(phase);}
  function issuesDialog(){const n=active(),err=S.errors[n];if(!err)return;openDialog('本轮问题 · '+PH[n-1].short,`<p>这些问题来自当前批次的实际本地计算，不是预置的失败结果。原记录与证据均未被覆盖。</p>${table(['涉及内容','问题说明'],err.issues.map((x,i)=>typeof x==='string'?[`问题 ${i+1}`,x]:[x.target||x.name,x.detail]))}${err.tests?`<div class="dialog-section"><h3>当前关系与验收预期</h3></div>${table(['来源','员工 → 部门'],[['实际结果',err.tests.actual.map(r=>r.join(' → ')).join('；')],['独立预期',err.tests.expected.map(r=>r.join(' → ')).join('；')]])}`:''}<div class="note-box warning" style="margin-top:15px">修改数据、补充部门或修订明确的验收预期后，将清空旧结果并重新运行。系统不会为通过检查而自动删除规则或挑选一个冲突值。</div>`,`<button class="btn" data-action="close">返回操作台</button><button class="btn primary" data-action="edit-from-issue">修改当前批次</button>`,true,'issues');}
  function evidenceDialog(index){
    const data=b(3),r=data?.relations[index];if(!r)return;
    const docs=r.evidence_refs.map(id=>data.evidence.find(e=>e.id===id)).filter(Boolean),body=`<p>${esc(r.employee)}（${esc(r.employee_id)}） → ${esc(r.department)}（${esc(r.department_id)}）。以下依据均来自当前批次。</p>${docs.map(ev=>ev.kind==='text'?`<div class="dialog-section"><h3>归属原文</h3>${tag('文本依据','purple')}</div><div class="quote">${esc(ev.quote)}</div><p class="comparison-note">文本第 ${ev.line} 行 · 字符区间 [${ev.start}, ${ev.end})，按 Unicode 码点计数。</p>`:`<div class="dialog-section"><h3>业务记录</h3>${tag('记录依据')}</div>${table(['名称','记录值'],[['员工编号',ev.record.employee_id],['姓名',ev.record.employee_name],['部门编号',ev.record.department_id]])}<p class="comparison-note">原始位置：${esc(ev.locator)}。事实合并不删除这份来源记录。</p>`).join('')}<div class="note-box" style="margin-top:16px">引文定位与身份匹配在浏览器本地执行；不代表已经调用模型或完成正式语义审核。</div>`;
    const returnReview=dialogKind==='review';openDialog('查看当前关系的来源',body,`<button class="btn" data-action="${returnReview?'back-review':'close'}">${returnReview?'返回本轮确认':'返回操作台'}</button>`,false,returnReview?'evidence-review':'evidence');
  }
  function editorRows(type){const employees=type==='employees',cols=employees?['员工编号','姓名','部门编号']:['部门编号','部门名称'],fields=employees?['employee_id','employee_name','department_id']:['department_id','department_name'];return`<div class="data-table form-table"><table><thead><tr>${cols.map(c=>`<th scope="col">${c}</th>`).join('')}<th scope="col" style="width:34px"><span class="sr-only">移除</span></th></tr></thead><tbody>${draft[type].map((r,i)=>`<tr>${fields.map((k,j)=>`<td><input data-edit-type="${type}" data-row="${i}" data-field="${k}" value="${esc(r[k])}" aria-label="${employees?'员工':'部门'}第${i+1}行${cols[j]}" maxlength="200"></td>`).join('')}<td><button class="remove" data-remove-type="${type}" data-row="${i}" aria-label="移除${employees?'员工':'部门'}第${i+1}行">×</button></td></tr>`).join('')}</tbody></table></div>`;}
  function dataDialog(keep=false){
    if(!keep)draft=E.copy(S.input);
    const body=`<p>记录、文本和规则共同驱动五个流程。这里修改的内容会真实改变后续对象、关系、数量和校验结果。</p><div class="dialog-section"><h3>员工记录</h3><button class="text-btn" data-action="add-employee">＋ 添加一行</button></div>${editorRows('employees')}<div class="dialog-section"><h3>部门记录</h3><button class="text-btn" data-action="add-department">＋ 添加一行</button></div>${editorRows('departments')}<div class="dialog-section"><h3>归属原文</h3><span class="small muted">保持原始陈述</span></div><textarea id="edit-text" rows="3" aria-label="归属原文">${esc(draft.text)}</textarea><p class="comparison-note">当前本地规则只处理“员工 E-001 归属部门 D-01。”这一陈述格式；其他文本会明确进入待处理清单，不宣称自动理解。</p><details id="expected-details"><summary>业务规则与独立验收预期</summary><div class="details-body"><p class="small muted" style="margin-bottom:12px">当前范围固定为员工、部门及当前归属。每位员工只能对应一个已登记部门；身份编号和名称保持非空字符串。</p><label class="check-label"><input type="checkbox" id="edit-baseline" ${draft.useBaseline?'checked':''}><span>复用已有的员工、部门与所属关系定义；取消时走本地新建结构路径。</span></label><div class="dialog-section"><h3>查询预期</h3><span class="small muted">不随记录自动改写</span></div><textarea id="edit-expected" rows="4" aria-label="独立查询预期" placeholder="每行：员工编号,部门编号">${esc(draft.expected.map(r=>r.join(',')).join('\n'))}</textarea><p class="comparison-note">每行一个独立预期，例如 E-001,D-01。增删员工时也须明确更新预期，不从最终结果反推正确答案。</p></div></details><div class="note-box warning" style="margin-top:16px">保存新批次后，原有五个流程的结果与模拟确认全部失效，需要重新运行。不会静默沿用旧输出。</div>`;
    openDialog('当前批次数据',body,`<button class="btn tiny left" data-action="download-batch">下载批次 JSON</button><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="save-data">保存并重新建模</button>`,true,'data');
  }
  function syncDraft(){
    if(!draft)return;dlg.querySelectorAll('[data-edit-type]').forEach(i=>draft[i.dataset.editType][Number(i.dataset.row)][i.dataset.field]=i.value);
    draft.text=document.getElementById('edit-text')?.value??draft.text;draft.useBaseline=document.getElementById('edit-baseline')?.checked??draft.useBaseline;
    const text=document.getElementById('edit-expected')?.value;if(text!==undefined)draft.expected=text.split('\n').filter(s=>s.trim()).map(line=>line.split(/[,，]/).map(s=>s.trim()));
  }
  function saveData(){try{syncDraft();const input=E.sanitizeInput(draft);if(E.stable(input)===E.stable(S.input)){dlg.close();toast('数据没有变化，保留当前结果。');return;}token++;busy=false;continuous=false;S.input=input;S.revision++;invalidate(1);S.selected=1;event('当前批次已修改为 R'+S.revision+'，旧结果与旧模拟确认已失效。');save();dialogKind='';dlg.close();render();toast('已保存新批次，请从范围确认重新运行。');}catch(e){toast(e.message);}}
  function describeFile(f){const descriptions={'ontology.ttl':['本体结构','定义对象类型、属性和所属关系'],'instances.ttl':['对象与事实','保存当前批次的具体对象与关系'],'shapes.ttl':['数据约束','保存明确的必填、类型与数量要求'],'mapping.json':['映射规则','记录数据如何转换为本体事实'],'evidence.json':['来源依据','保留原始记录及原文位置'],'provenance.jsonl':['事实溯源','关联每条事实与全部来源'],'validation.json':['校验记录','分别标记本地检查与未运行的正式验证'],'review.json':['模拟确认记录','不冒充经过认证的人工审批'],'queries/employee_departments.rq':['查询文件','待实际 SPARQL 引擎执行'],'tests/expected_results.json':['独立预期','在构建前冻结的正确答案'],'tests/local_assertions.json':['本地断言','当前 JavaScript 的正向与异常检查结果'],'manifest.json':['文件清单','各文件摘要及本轮版本引用']};return descriptions[f]||['输出文件','本轮生成内容'];}
  function filesDialog(){const output=b(5);if(!output)return toast('完成编译交付后才能查看文件。');openDialog('本轮编译产物',`<p>这些文件由当前批次的确认结果生成，不是固定参考文件。正式 SHACL / OWL / SPARQL 验证未执行。</p><div class="file-list">${Object.keys(output.files).map(f=>{const [title,desc]=describeFile(f);return`<div class="file-item">${ico('file')}<div><strong>${title} <code> · ${esc(f)}</code></strong><small>${desc}</small></div><button class="btn tiny" data-preview-file="${esc(f)}">查看</button><button class="btn tiny" data-download-file="${esc(f)}">下载</button></div>`;}).join('')}</div>`,`<button class="btn" data-action="close">关闭</button><button class="btn primary" data-action="zip">${ico('download')}下载全部产物</button>`,true,'files');}
  function previewFile(path){const content=b(5)?.files[path];if(content===undefined)return;openDialog(esc(describeFile(path)[0]),`<p>${esc(path)} · 当前批次 R${S.revision}</p><pre>${esc(content)}</pre>`,`<button class="btn" data-action="files">返回文件列表</button><button class="btn primary" data-download-file="${esc(path)}">下载文件</button>`,true,'file');}
  function primary(){const n=active(),s=S.statuses[n-1];if(s==='done'){if(n===5)downloadZip();else setPhase(n+1);}else if(s==='review')reviewDialog(n);else if(s==='blocked')issuesDialog();else run(n);}
  function downloadZip(){if(!b(5))return;download('知构工具链_本轮产物_R'+S.revision+'.zip',E.zip(b(5).files));}
  const actions={
    primary,
    focus:()=>{S.focus=!S.focus;save();render();},
    previous:()=>setPhase(active()-1),
    upstream:()=>setPhase(Math.max(1,S.statuses.findIndex(x=>x!=='done')+1)),
    continuous:()=>{if(continuous){continuous=false;render();toast('已停止自动流转；当前正在执行的流程会完成。');return;}continuous=true;const n=S.statuses.findIndex(x=>x!=='done')+1;if(n===0){continuous=false;return toast('五个流程均已完成，可下载本轮产物。');}S.selected=n;render();if(S.statuses[n-1]==='review')reviewDialog(n);else if(S.statuses[n-1]==='blocked'){continuous=false;issuesDialog();}else run(n);},
    data:()=>{continuous=false;dataDialog();},
    'edit-from-issue':()=>dataDialog(),
    'save-data':saveData,
    'add-employee':()=>{syncDraft();if(draft.employees.length>=100)return toast('最多 100 条员工记录。');draft.employees.push({employee_id:'',employee_name:'',department_id:'',source_ref:'SRC-EMP'});dataDialog(true);},
    'add-department':()=>{syncDraft();if(draft.departments.length>=100)return toast('最多 100 条部门记录。');draft.departments.push({department_id:'',department_name:'',source_ref:'SRC-DEP'});dataDialog(true);},
    'download-batch':()=>{syncDraft();try{download('知构_当前批次.json',JSON.stringify(E.sanitizeInput(draft),null,2));}catch(e){toast(e.message);}},
    close:closeDialog,
    confirm:confirmReview,
    'back-review':()=>reviewDialog(pending?.phase||active()),
    issues:issuesDialog,
    files:filesDialog,
    zip:downloadZip,
    rerun:()=>{continuous=false;const n=active();openDialog('重新运行“'+PH[n-1].short+'”',`<p>这会清空该流程及其后续流程的结果与模拟确认，保留上游已经完成的输出，再重新计算。</p>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="confirm-rerun">清空下游并重新运行</button>`,false,'rerun');},
    'confirm-rerun':()=>{const n=active();invalidate(n);event(PH[n-1].short+'及下游结果已失效，准备重算。');dlg.close();save();run(n);},
    reset:()=>{continuous=false;openDialog('重置本轮模拟',`<p>恢复初始批次，清除本地五个流程的进度、产物与模拟确认。不会影响任何远程系统。</p>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="confirm-reset">确认重置</button>`,false,'reset');},
    'confirm-reset':()=>{token++;busy=false;continuous=false;pending=null;S=defaults();save();dlg.close();render();toast('已恢复初始批次，五个流程等待重新运行。');},
    export:()=>download('知构工具链_五流程运行记录_R'+S.revision+'.json',JSON.stringify({product:'知构工具链',mode:'LOCAL_SIMULATION',formal_services:'NOT_RUN',revision:S.revision,input:root(),outputs:S.outputs.filter(Boolean),events:S.events},null,2)),
    events:()=>openDialog('本轮运行记录',S.events.length?`<p>只记录本地五个流程的计算、确认和数据变化，不包含虚构的模型执行日志。</p>${S.events.slice().reverse().map(e=>`<div class="event-row"><time>${esc(new Date(e.time).toLocaleTimeString('zh-CN',{hour12:false}))}</time><p>${esc(e.text)}</p></div>`).join('')}`:'<p>尚未运行。从范围确认开始后，将在此保存每个大流程的实际本地状态。</p>',`<button class="btn" data-action="close">关闭</button>`,false,'events'),
    boundary:()=>openDialog('本地模拟的运行边界',`<div class="dialog-section"><h3>这里实际执行的内容</h3></div><p>批次检查、固定结构配置、记录映射、固定句式匹配、身份解析、事实去重、来源关联、本地规则检查、独立答案比对、语义文件与 ZIP 生成。数据或规则配置变化后，结果重新计算。</p><div class="dialog-section"><h3>这里没有执行的内容</h3></div><p>没有连接后台、生成模型、向量模型或检索服务；没有运行完整 SHACL、OWL 推理器或 SPARQL 引擎；模拟确认不具备正式审批效力，下载不代表发布。</p><div class="note-box">关系文本仅按限定句式在本地解析；未知内容明确阻断。此页面是一份可操作的流程模拟，不是生产本体服务。</div>`,`<button class="btn" data-action="close">知道了</button>`,false,'boundary')
  };
  document.addEventListener('click',ev=>{const target=ev.target.closest('[data-action],[data-phase],[data-view],[data-evidence],[data-remove-type],[data-preview-file],[data-download-file]');if(!target||target.disabled)return;
    if(target.dataset.action){actions[target.dataset.action]?.();return;}
    if(target.dataset.phase){setPhase(Number(target.dataset.phase));return;}
    if(target.dataset.view){view=target.dataset.view;render();return;}
    if(target.dataset.evidence!==undefined){evidenceDialog(Number(target.dataset.evidence));return;}
    if(target.dataset.removeType){syncDraft();draft[target.dataset.removeType].splice(Number(target.dataset.row),1);dataDialog(true);return;}
    if(target.dataset.previewFile){previewFile(target.dataset.previewFile);return;}
    if(target.dataset.downloadFile){const f=target.dataset.downloadFile;if(b(5)?.files[f]!==undefined)download(f.replaceAll('/','_'),b(5).files[f],f.endsWith('.ttl')?'text/turtle;charset=utf-8':'text/plain;charset=utf-8');}
  });
  document.addEventListener('keydown',ev=>{
    if(ev.target.matches('[data-evidence]')&&['Enter',' '].includes(ev.key)){ev.preventDefault();evidenceDialog(Number(ev.target.dataset.evidence));return;}
    if(dlg.open||ev.altKey||ev.ctrlKey||ev.metaKey||ev.target.matches('input,textarea,select')||ev.target.isContentEditable)return;
    if(ev.key==='ArrowRight'){ev.preventDefault();setPhase(active()+1);}else if(ev.key==='ArrowLeft'){ev.preventDefault();setPhase(active()-1);}else if(/^[1-5]$/.test(ev.key)){ev.preventDefault();setPhase(Number(ev.key));}else if(ev.key.toLowerCase()==='f'){ev.preventDefault();actions.focus();}
  });
  window.addEventListener('beforeunload',save);
  render();if(restoreNotice)toast(restoreNotice);
  window.__ZG_TEST__={state:()=>E.copy(S),pending:()=>E.copy(pending),busy:()=>busy,continuous:()=>continuous,engine:E};
})();
</script></body></html>
